name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # api + ui extras so service/ and app/ type-check and their tests
          # run; the app is installed as its own project so `rag_chat` imports.
          python -m pip install .[dev,api,ui]
          python -m pip install ./app

      - name: Lint and format check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      # Bandit as well as Ruff's flake8-bandit (`S`) rules: the two do not
      # overlap completely, and Bandit reports severity and confidence, so a
      # finding can be triaged rather than only suppressed. Any finding fails
      # the build.
      - name: Security scan (Bandit)
        run: bandit -c pyproject.toml -q -r src/ service/ app/src/ scripts/

      # The entry points are checked as well as the package. They hold real
      # logic — assembly, streaming, session state — so this proves service/
      # and app/ type-check against a declared dependency set, not just on a
      # developer's machine.
      - name: Type check (Mypy)
        run: mypy src/ service/ app/src/ app/tests/ scripts/

      # Integration tests need a live MariaDB and local model weights, neither
      # of which exists on a runner. They are deselected rather than skipped so
      # that a genuine failure cannot hide behind a skip.
      #
      # The threshold is lower than the local one because the database and
      # model-loading paths are only reachable with those services present:
      # the unit suite alone reaches about 90%, the full local suite 99%.
      # Deselecting integration tests must not be able to mask a real drop in
      # the code CI can actually exercise, hence a floor rather than no gate.
      - name: Unit tests (Pytest)
        run: pytest -m "not integration" --cov-fail-under=85

      # The dependency rules are the architecture. They are checked separately
      # so that a violation is reported as its own failure rather than as one
      # test among many.
      - name: Architecture rules
        run: pytest tests/test_architecture.py --no-cov -q
