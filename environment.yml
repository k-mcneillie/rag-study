name: rag-study-py3.12
channels:
  - conda-forge
dependencies:
  - python=3.12

  # --- Storage -------------------------------------------------------------
  - sqlalchemy>=2.0.30       # ORM / query construction (parameterised SQL)
  - pymysql>=1.1.1           # pure-Python MariaDB/MySQL driver

  # --- Configuration -------------------------------------------------------
  - python-dotenv>=1.0.1     # load infrastructure config from a local .env

  # --- Ingestion (Phase 3) -------------------------------------------------
  - pymupdf>=1.24            # PDF parsing and text extraction

  # --- Embedding (Phase 3) -------------------------------------------------
  - sentence-transformers>=3.0  # local embedding models, loaded offline

  # --- Testing and quality gates -------------------------------------------
  - pytest>=8.0
  - pytest-cov>=5.0
  - ruff>=0.6
  - mypy>=1.11

  - pip
  - pip:
      # pymupdf4llm is not published on conda-forge; markdown-oriented PDF
      # extraction used by the chunking pipeline.
      - pymupdf4llm>=0.0.17
      # The package, editable, with dev tools plus the optional HTTP API
      # (service/) and chat-UI (app/) dependency sets.
      - -e .[dev,api,ui]
      # The chat app is its own project; install it so `rag_chat` imports and
      # its tests run in `just check-all`.
      - -e ./app
