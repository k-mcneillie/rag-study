[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-study"
version = "0.1.0"
description = "A simple, modular, offline-capable RAG package with independent ingestion and retrieval pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Konner McNeillie", email = "110234880+k-mcneillie@users.noreply.github.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    # Storage: SQLAlchemy ORM over MariaDB (PyMySQL is a pure-Python driver,
    # avoiding a MariaDB Connector/C build dependency).
    "SQLAlchemy>=2.0.30",
    "PyMySQL>=1.1.1",
    # Configuration: load infrastructure settings from a local .env file.
    "python-dotenv>=1.0.1",
    # Numerical: vector handling and the application-side ranking fallback.
    "numpy>=1.26.0",
    # Ingestion (Phase 3): PDF extraction.
    "PyMuPDF>=1.24.0",
    "pymupdf4llm>=0.0.17",
    # Embedding (Phase 3): local, offline sentence-transformer models.
    "sentence-transformers>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/k-mcneillie/rag-study"
Repository = "https://github.com/k-mcneillie/rag-study.git"
Issues = "https://github.com/k-mcneillie/rag-study/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing --cov-report=xml"
markers = [
    "integration: tests requiring a live MariaDB server (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# These ship no type information of their own.
module = ["pymupdf4llm.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (PEP 8)
    "W",   # pycodestyle warnings (PEP 8)
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modern 3.12+ syntax)
    "C90", # mccabe complexity
    "C4",  # flake8-comprehensions
    "N",   # PEP 8 naming conventions
    "SIM", # flake8-simplify
    "ARG", # unused arguments
    "D",   # pydocstyle (Google-style docstrings)
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations (type annotations required)
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert` (S101) and contain dummy credentials used to
# prove that real ones are never exposed (S105, S106).
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
