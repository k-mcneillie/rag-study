[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chat-openai"
version = "0.1.0"
description = "A standalone Chainlit chat interface for an OpenAI-language RAG service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # The chat UI.
    "chainlit>=2.0.0",
    # HTTP client and its server-sent-events helper, for talking to the provider.
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    # Load RAG_OPENAI_* from a local .env file.
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_chat_openai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
# The code targets the same standard as the rest of rag-study: static typing
# on Python 3.12+, modern annotation syntax, no untyped defs.
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["chainlit.*"]
ignore_missing_imports = true

# Ruff config mirrors the parent rag-study repository, so this directory holds
# to the same standard whether it is checked here or after being copied out.
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C90",
    "C4",
    "N",
    "SIM",
    "ARG",
    "D",
    "S",
    "ANN",
    "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
